[tool.ruff]
line-length = 88
target-version = "py312"
extend-select = [
    "E", 
    "F", 
    "W", 
    "I", 
    "B", 
    "S", 
]

ignore = [
    "E741",
    "F403",     # wildcard-imports allow (from A import *)
    "F405",     # неявный импорт (дополняет F403)
    "S105",     # слово token зарезервировано под транслятор - там не может быть секретных данных
    "SIM108",   # использование тернарных операторов вместо if/else (кратко и понятно)
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = false
disallow_untyped_defs = false
