source: |
  var a_lo
  var a_hi
  var b_lo
  var b_hi
  var r_lo
  var r_hi

  \ A = 0x00000001_FFFFFFFF = 8589934591
  -1 a_lo !
  1 a_hi !

  \ B = 0x00000001_00000001 = 4294967297
  1 b_lo !
  1 b_hi !

  a_lo @ a_hi @
  b_lo @ b_hi @
  d+

  \ A + B = 0x00000003_00000000
  r_hi !
  r_lo !

  ." res_high = "
  r_hi @ .
  ." , "
  ." res_low = "
  r_lo @ .

