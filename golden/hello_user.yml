source: |
  var vlen
  var vbuf 20 allot       \ аллокация 20 слов для ввода имени (20 символов максимум)
  var vptr

  ." enter your name: "

  vbuf vptr !             \ vptr = ptr(vbuf)
  0 vlen !

  begin
    key
    dup 10 = if
      drop
      1
    else
      vptr @ !
      vptr @ 4 + vptr !
      vlen @ 1 + vlen !
      0
    endif
  until

  vlen @ vbuf 4 - !

  ." hello, "
  vbuf 4 - s.
  ." !"

input:
  3: [M, a, x, ' ', K, a, r, n, "\n"]

head: 300
