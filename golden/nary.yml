source: |
  var sum_res
  var mul_res

  1 2 3 4 5 6 6 n+ sum_res !
  1 2 3 4 5 6 6 n* mul_res !

  ." sum_res = "
  sum_res @ .
  ." , mul_res = "
  mul_res @ .


